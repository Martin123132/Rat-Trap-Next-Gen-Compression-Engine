[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rat-trap"
version = "5.2.0"
description = "Windows-first compressed snapshots, portable GMW archives, and queryable Vaults"
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [
    { name = "Glyn Evans" },
    { name = "Martin Ollett" }
]
keywords = ["compression", "search", "sqlite", "vault", "csv", "json", "zstandard", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: System :: Archiving :: Compression",
    "Intended Audience :: Developers"
]
requires-python = ">=3.9"
dependencies = [
    "pyfastcdc>=0.2.1,<0.3",
    "zstandard>=0.21.0",
]

[project.optional-dependencies]
crypto = ["cryptography>=41.0.0", "xxhash>=3.0.0"]

[project.scripts]
rat-trap = "rat_trap.cli:main"

[tool.setuptools]
packages = ["rat_trap"]
include-package-data = true
